<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>One-Click Auto Video</title>
    <style>
        body {
            margin: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .btn {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
        }
        video {
            width: 90%;
            max-width: 900px;
            display: none; /* 初始隐藏 */
        }
    </style>
</head>
<body>

    <button class="btn" onclick="playVideo()">点击开始播放</button>

    <video
        id="myVideo"
        src="video.mp4"
        autoplay
        controls
        loop
        playsinline>
    </video>

    <script>
        function playVideo() {
            const video = document.getElementById('myVideo');
            video.style.display = 'block'; // 显示视频
            video.play();                  // 播放视频
            document.querySelector('.btn').style.display = 'none'; // 隐藏按钮
        }
    </script>

</body>
</html>
