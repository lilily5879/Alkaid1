<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Video Player</title>
    <style>
        body {
            background: #222;
            text-align: center;
            padding-top: 40px;
            font-family: Arial, sans-serif;
        }
        h2 {
            color: #fff;
            margin-bottom: 20px;
        }
        video {
            max-width: 90%;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

    <h2>我的视频（MP4 格式）</h2>

    <!-- 视频播放器 -->
    <video controls autoplay muted loop>
        <!-- 优先加载 MP4，兼容性最好 -->
        <source src="video.mp4" type="video/mp4">
