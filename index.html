<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Video Page</title>
    <style>
        body {
            background: #111;
            text-align: center;
            padding-top: 40px;
            font-family: Arial, sans-serif;
        }
        h2 {
            color: #fff;
            margin-bottom: 20px;
        }
        video {
            max-width: 90%;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(255,255,255,0.15);
        }
    </style>
</head>
<body>

    <h2>我的视频</h2>

    <video controls autoplay muted loop>
        <source src="video.mp4" type="video/mp4">
        您的浏览器不支持 video 标签
    </video>

</body>
</html>
